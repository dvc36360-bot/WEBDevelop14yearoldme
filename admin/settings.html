<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/supabase.js" defer></script><script src="../js/common.js" defer></script><script src="../js/admin.js" defer></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--bg:#f5f8ff;--surface:#fff;--text:#151a2d;--muted:#667085;--blue:#2458d3;--red:#e44955;--line:#e5e9f2;--shadow:0 12px 34px rgba(20,40,90,.08)}
:root[data-theme="dark"]{--bg:#101522;--surface:#192235;--text:#f4f6fb;--muted:#aab4c8;--blue:#7397ff;--red:#ff7881;--line:#303b50;--shadow:0 12px 34px rgba(0,0,0,.2)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px 'DM Sans',Arial,sans-serif;line-height:1.6}a{color:var(--blue);text-decoration:none}img{max-width:100%}.wrap{width:min(1120px,92%);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0}.brand img{width:210px;height:auto;display:block}.nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.nav a{font-weight:700;color:var(--text)}.button,button{border:0;border-radius:12px;padding:11px 17px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}.secondary{background:var(--surface);color:var(--text);border:1px solid var(--line)}.danger{background:var(--red)}.panel,.card,.product-card,.order-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.hero{padding:64px 0 46px}.hero h1{font-size:clamp(2.3rem,6vw,4.5rem);line-height:1.05;max-width:800px;margin:12px 0}.hero p{max-width:680px;color:var(--muted);font-size:1.1rem}.eyebrow{color:var(--red);font-weight:800;letter-spacing:.1em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.section{padding:28px 0 54px}.muted{color:var(--muted)}form{display:grid;gap:13px}label{font-weight:700}input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}textarea{min-height:95px}.notice{margin:12px 0;padding:10px 13px;border-radius:10px}.success{background:#e5f8ed;color:#146c39}.error{background:#ffe9e9;color:#a2222b}.list-row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid}.stat b{font-size:2rem}.footer{padding:32px 0;color:var(--muted);border-top:1px solid var(--line);margin-top:50px}.auth{max-width:480px;margin:45px auto}.logo-small{width:180px}.pill{display:inline-block;border-radius:99px;padding:5px 11px;background:rgba(36,88,211,.1);color:var(--blue);font-weight:700}@media(max-width:650px){.topbar{align-items:flex-start;flex-direction:column}.brand img{width:180px}.hero{padding:38px 0}.nav{gap:12px}}


.admin-layout{display:grid;grid-template-columns:340px 1fr;gap:20px}@media(max-width:760px){.admin-layout{grid-template-columns:1fr}}

.menu-toggle{display:none;background:var(--surface);color:var(--text);border:1px solid var(--line);font-size:1.35rem;padding:7px 12px}
.settings-link{font-size:1.55rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
@media(max-width:760px){
 .topbar{position:relative;flex-direction:row;align-items:center;flex-wrap:wrap}
 .menu-toggle{display:inline-block;margin-left:auto}
 .nav[data-menu]{display:none;flex-basis:100%;width:100%;flex-direction:column;align-items:stretch;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:15px}
 .nav[data-menu].open{display:flex}
 .nav[data-menu] a{padding:8px 4px}
 .nav[data-menu] button{width:100%}
}


/* WebWinkel vibrant visual refresh */
:root{--blue:#2458d3;--red:#e44955;--gold:#ffc857;--mint:#dff8ef}
body{background:
 radial-gradient(ellipse at 8% 0%,rgba(36,88,211,.10),transparent 32rem),
 radial-gradient(ellipse at 96% 16%,rgba(228,73,85,.09),transparent 27rem),
 var(--bg)}
.topbar{min-height:86px;position:relative;z-index:20}
.brand img{width:clamp(155px,19vw,220px);border-radius:7px;transition:transform .25s}
.brand:hover img{transform:translateY(-2px) scale(1.015)}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.gear-link{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border-radius:15px;
 background:linear-gradient(145deg,var(--blue),#547ef0);box-shadow:0 8px 20px rgba(36,88,211,.25);transition:.2s}
.gear-link:hover{transform:rotate(28deg) scale(1.06);box-shadow:0 12px 24px rgba(36,88,211,.32)}
.gear-link svg{width:24px;height:24px;fill:white}
.menu-toggle{display:flex;flex-direction:column;gap:5px;width:46px;height:46px;align-items:center;justify-content:center;
 background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:0}
.menu-toggle span{width:19px;height:2px;background:var(--text);border-radius:4px;display:block}
.nav{padding:8px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.nav a{padding:8px 10px;border-radius:10px;transition:.2s}
.nav a:hover{background:rgba(36,88,211,.10);color:var(--blue)}
.button,button{transition:transform .18s,box-shadow .18s,filter .18s}
.button:hover,button:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 9px 20px rgba(36,88,211,.2)}
.secondary{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.hero{position:relative;overflow:hidden;padding:76px 0 64px;background:linear-gradient(120deg,rgba(36,88,211,.12),rgba(228,73,85,.10),rgba(255,200,87,.12));border:1px solid rgba(36,88,211,.08);border-radius:0 0 36px 36px}
.hero:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;right:5%;top:10%;background:linear-gradient(135deg,rgba(255,200,87,.35),rgba(228,73,85,.15));filter:blur(2px);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{letter-spacing:-.045em;max-width:780px}
.hero p{max-width:650px}
.eyebrow,.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:7px 13px;background:rgba(228,73,85,.10);color:var(--red);font-size:.82rem;font-weight:800}
.section h1,.section h2,.admin-hero h1{letter-spacing:-.035em}
.card,.panel,.product-card,.order-card{position:relative;overflow:hidden;transition:transform .22s,box-shadow .22s,border-color .22s}
.card:hover,.product-card:hover,.order-card:hover{transform:translateY(-5px);box-shadow:0 18px 42px rgba(20,40,90,.13);border-color:rgba(36,88,211,.25)}
.card:before{content:"";position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(var(--blue),var(--red));opacity:.85}
.grid{gap:22px}
.product-card h3,.card h3{margin-top:4px}
.stat{background:linear-gradient(145deg,var(--surface),rgba(36,88,211,.06));border-radius:20px}
.stat b{color:var(--blue)}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(36,88,211,.17);border-color:var(--blue)}
.footer{background:rgba(36,88,211,.035)}
.auth{border-radius:24px}
@media(max-width:760px){
 .topbar{display:flex;flex-wrap:wrap;gap:12px}
 .top-actions{order:2}
 .nav[data-menu]{display:none;order:3;flex-basis:100%;width:100%;flex-direction:column;align-items:stretch;margin-top:8px;padding:14px}
 .nav[data-menu].open{display:flex}
 .nav[data-menu] a{padding:10px 12px}
 .nav[data-menu] button{width:100%}
 .hero{padding:48px 0 42px}
 .hero:after{width:170px;height:170px;right:-45px;top:5%}
}

</style>
